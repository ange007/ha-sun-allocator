# Pin the lint rule set so `ruff check .` is deterministic across ruff versions.
# CI installs ruff unpinned, and a newer release began flagging import-sort (I001) by
# default — a rule this package has never enforced and cannot cleanly satisfy given its
# deliberate deferred / re-export imports (see the `# noqa: E402, F401` re-exports in
# core/power_processor.py). Keep the classic default set (pyflakes + pycodestyle errors),
# which still catches the substance (undefined names, unused imports/vars, syntax).
[lint]
select = ["E4", "E7", "E9", "F"]
