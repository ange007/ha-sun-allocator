title: SunAllocator Power Distribution
type: vertical-stack
cards:
  - type: entities
    title: Power Distribution Overview
    entities:
      - entity: sensor.sun_allocator_power_distribution
        name: Total Allocated Power
        secondary_info: last-changed
      - type: attribute
        entity: sensor.sun_allocator_power_distribution
        # total_power = the allocation budget = max(cautious excess, probe headroom).
        # Under curtailment this exceeds the raw excess sensor by the probe-discovered
        # surplus, so label it as the budget, not "available power".
        attribute: total_power
        name: Allocation Budget (excess + probe)
      - type: attribute
        entity: sensor.sun_allocator_power_distribution
        attribute: remaining_power
        name: Remaining Power
      - type: attribute
        entity: sensor.sun_allocator_power_distribution
        attribute: allocated_power
        name: Allocated Power
  - type: markdown
    content: >-
      {% set SENSOR = 'sensor.sun_allocator_power_distribution' %} 
      {% set meta = state_attr(SENSOR, 'device_meta') or {} %} 
      {% set alloc = state_attr(SENSOR, 'allocation_w') or {} %} 
      {% set percent = state_attr(SENSOR, 'allocation_percent') or {} %} 
      {% set reasons = state_attr(SENSOR, 'reasons') or {} %}

      {% if meta and meta.items() %}
        {% for id, st in meta.items() %}
        <div>
          <div>
            <b style>{% if percent.get(id, 0) > 0 %}🟢{% else %}⚪{% endif %} {{ st.name or id }}</b>
            <br>
            <small>Priority: {{ st.priority }}</small>
          </div>
          <div>
            <b>{{ alloc.get(id, 0)|round(1) }} W</b> ({{ percent[id]|default(0)|round(1) }}%)
            <br>
            {% set r = reasons.get(id, {}) %}
            <small>{{ r.get('status', '-') }}{% if r.get('refusals') %} — {{ r.refusals | join(', ') }}{% endif %}</small>
          </div>
          <hr />
        </div>
        {% endfor %}
      {% else %}
        Device not found
      {% endif %}
    title: Devices
  - type: custom:mini-graph-card
    title: Power Allocation
    entities:
      - entity: sensor.sun_allocator_power_distribution
        name: Allocated Power
        attribute: allocated_power
      - entity: sensor.sun_allocator_power_distribution
        name: Remaining Power
        attribute: remaining_power
    hours_to_show: 1
    points_per_hour: 12
    show:
      fill: true
      legend: true
    color_thresholds:
      - value: 0
        color: "#00ba47"
      - value: 50
        color: "#f39c12"
      - value: 80
        color: "#d35400"
  - type: custom:mini-graph-card
    title: Power Distribution History
    entities:
      - entity: sensor.sun_allocator_power_distribution
        name: Allocated Power
      - entity: sensor.sun_allocator_excess_power
        # Cautious excess — under curtailment (battery full, low load) this
        # UNDER-reports the true harvestable surplus; the probe budget on the
        # power_distribution sensor (total_power) reflects the fuller picture.
        name: Excess (cautious)
    hours_to_show: 24
    points_per_hour: 4
    line_width: 2
    show:
      fill: true
      legend: true
